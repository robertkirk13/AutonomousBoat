<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat Sensors</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: sans-serif; padding: 16px; }
  h1 { text-align: center; margin-bottom: 16px; color: #58a6ff; font-size: 1.4rem; letter-spacing: 1px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .label { font-size: .7rem; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .value { font-size: 1.6rem; font-weight: bold; color: #58a6ff; }
  .unit  { font-size: .75rem; color: #8b949e; margin-top: 2px; }
  #sonar-wrap {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  #sonar-wrap h2 { font-size: .85rem; color: #8b949e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  canvas { display: block; margin: 0 auto; }
  #status { text-align: center; font-size: .7rem; color: #8b949e; margin-top: 10px; }
</style>
</head>
<body>
<h1>Boat Sensor Dashboard</h1>

<div class="grid">
  <div class="card">
    <div class="label">Temperature</div>
    <div class="value" id="temp">--</div>
    <div class="unit">°F</div>
  </div>
  <div class="card">
    <div class="label">pH</div>
    <div class="value" id="ph">--</div>
    <div class="unit"></div>
  </div>
  <div class="card">
    <div class="label">EC</div>
    <div class="value" id="ec">--</div>
    <div class="unit">mS/cm</div>
  </div>
  <div class="card">
    <div class="label">Turbidity</div>
    <div class="value" id="turb">--</div>
    <div class="unit">NTU</div>
  </div>
  <div class="card">
    <div class="label">Distance</div>
    <div class="value" id="dist">--</div>
    <div class="unit">mm</div>
  </div>
</div>

<div id="sonar-wrap">
  <h2>Sonar — Forward Distance</h2>
  <canvas id="sonar" width="320" height="180"></canvas>
</div>

<div id="status">Connecting...</div>

<script>
const canvas = document.getElementById('sonar');
const ctx    = canvas.getContext('2d');

const MAX_MM     = 6000;
const CX         = canvas.width / 2;
const CY         = canvas.height;      // origin at bottom-center
const R          = canvas.height - 10; // max radius
const HALF_BEAM  = Math.PI / 12;       // 15 degrees (sensor beam ~8-16 deg)

function drawSonar(mm) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Range rings + labels
  for (let i = 1; i <= 6; i++) {
    const r = R * i / 6;
    ctx.strokeStyle = '#21262d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, r, Math.PI, 2 * Math.PI);
    ctx.stroke();

    ctx.fillStyle = '#484f58';
    ctx.font = '9px sans-serif';
    ctx.fillText((i * 1000) + 'mm', CX + r + 2, CY - 3);
  }

  // Axes
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, CY);     ctx.lineTo(CX, CY - R); ctx.stroke();

  // Beam cone outline (full range)
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(Math.PI + HALF_BEAM) * R, CY + Math.sin(Math.PI + HALF_BEAM) * R);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(2 * Math.PI - HALF_BEAM) * R, CY + Math.sin(2 * Math.PI - HALF_BEAM) * R);
  ctx.stroke();

  if (mm > 0 && mm <= MAX_MM) {
    const r   = R * mm / MAX_MM;
    // Color: green far, yellow mid, red close
    const hue = mm > 3000 ? 120 : mm > 1500 ? 60 : 0;

    // Filled detection wedge
    ctx.fillStyle = `hsla(${hue}, 80%, 50%, 0.2)`;
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, r, Math.PI + HALF_BEAM, 2 * Math.PI - HALF_BEAM);
    ctx.closePath();
    ctx.fill();

    // Arc at detected distance
    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.9)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(CX, CY, r, Math.PI + HALF_BEAM, 2 * Math.PI - HALF_BEAM);
    ctx.stroke();

    // Distance label
    ctx.fillStyle = '#e6edf3';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(mm.toFixed(0) + ' mm', CX, CY - r - 6);
    ctx.textAlign = 'left';
  }
}

function update(d) {
  document.getElementById('temp').textContent = d.temp_f.toFixed(1);
  document.getElementById('ph').textContent   = d.ph.toFixed(2);
  document.getElementById('ec').textContent   = d.ec.toFixed(2);
  document.getElementById('turb').textContent = d.ntu.toFixed(0);
  document.getElementById('dist').textContent = d.sonar_mm.toFixed(0);
  drawSonar(d.sonar_mm);
  document.getElementById('status').textContent =
    'Last update: ' + new Date().toLocaleTimeString();
}

drawSonar(0);


setInterval(() => {
  fetch('/data')
    .then(r => r.json())
    .then(update)
    .catch(() => {
      document.getElementById('status').textContent = 'Connection lost — retrying...';
    });
}, 500);
</script>
</body>
</html>
